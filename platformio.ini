; c3-field-swarm — ESP32-C3 Super Mini wireless swarm substrate
;
; Versions are pinned so "works today" does not become "breaks tomorrow".
; First hardware target: pio run && pio run -t upload && pio device monitor

[platformio]
default_envs = esp32-c3-supermini

[env:esp32-c3-supermini]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = direct, time
upload_speed = 460800

; ESP32-C3 Super Mini typically exposes USB-CDC.
build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D SWARM_FIRMWARE_VERSION=2
    -D SWARM_PROTOCOL_VERSION=1
    -D SWARM_MAX_NODES=6
    -D SWARM_HEARTBEAT_MS=500
    -D SWARM_TELEMETRY_MS=500
    ; Uncomment to enable simulated loss / reorder / duplication.
    ; -D SWARM_FAULT_INJECTION=1

board_build.flash_mode = qio
board_build.f_cpu = 160000000L

lib_deps =

[env:native]
platform = native@1.2.1
test_framework = unity
test_filter = test_*
build_flags =
    -std=c++17
    -D UNIT_TEST
    -D SWARM_FIRMWARE_VERSION=2
    -D SWARM_PROTOCOL_VERSION=1
    -D SWARM_MAX_NODES=6
    -D SWARM_HEARTBEAT_MS=500
    -I include
    -I src
build_src_filter =
    +<field/>
    +<swarm/election.cpp>
    +<swarm/membership.cpp>
    +<swarm/discovery.cpp>
    +<transport/packet_codec.cpp>
    +<systems/>
